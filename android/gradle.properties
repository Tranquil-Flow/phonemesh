org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
android.useAndroidX=true
kotlin.code.style=official
# Release APK ceilings in bytes; set from measured size plus ~3% margin, then raised for ncnn (owner, 2026-10-14)
# and by the measured 105 KB of accounts step 11 (ZXing, 64 safety icons; owner decision: measure, then raise),
# the same figures as .local/receipts/check-visual-growth.py. v0.1.1 raises arm64 by its measured growth (decision 35):
# +21 KB so far (local hub naming, reactions, Licences, profiles, colour wheel and pictures; 20,587 B over v0.1.0),
# +4 KB for the airtime meter (measured 3,268 B), +14 KB for the recovery key and its English and French word lists
# (measured 14,029 B), +16 KB for the Recovery kit screen and saved people (measured 16,168 B), +5 KB for photo avatars
# (measured 4,264 B). v0.1.2 may grow each ABI by at most 256 KB over signed v0.1.1 (decision 73), raised by measured
# growth: +40 KB for private group storage and transport (measured 39,020 B), +22 KB for the group screens (measured
# 21,476 B), +53 KB for full chat copies and saved chats (B lane; measured 52,928 B arm64 and 52,924 B armeabi-v7a over
# 04501a0, release builds), +35 KB for hub pack updates (measured 34,036 B arm64 and 34,040 B armeabi-v7a, unsigned
# release against the same tree before U5: signed catalog verifier, trust state, downloader, update controller, Updates
# screen, English and French words, packaged baseline), +18 KB for the B4 review fixes to full chat copies (measured
# 17,312 B arm64 and 17,312 B armeabi-v7a, unsigned release: WebP check, retained save and restore state, batched commits,
# worker-loaded saved chats; over 16,770,880 B arm64 and 14,761,178 B armeabi-v7a at 394b139).
# v0.1.3 may grow each ABI by at most 256 KB (262,144 B) over v0.1.2 in total, decision 73's convention (decision 78),
# raised by measured growth. Until signed v0.1.2 exists, growth is measured on unsigned release builds over the prepared
# candidate 10492845 (16,796,500 B arm64, 14,786,798 B armeabi-v7a): N1 +960 B, N2 +3,612 B, N3a +1,004 B, N3b +764 B,
# G4a +908 B, G3d +996 B, G3e +276 B, the same in each ABI (8,520 B so far). arm64 +1,000 B for G4a (16,803,748 B
# measured), +1,000 B for G3d (16,804,744 B measured) and +1,000 B for G3e (16,805,020 B measured); armeabi-v7a unchanged.
# The signed ceilings below are still v0.1.2's; v0.1.3's become signed v0.1.2 plus 262,144 B once the owner signs v0.1.2.
phonemesh.maxApkBytes.arm64-v8a=16806000
phonemesh.maxApkBytes.armeabi-v7a=14821000
# Ceilings for the owner-signed v0.1.2 APKs: signed v0.1.1 plus 262,144 bytes (decision 73). No Gradle task reads these (the
# build does not sign); android/scripts/signing_inputs.py records them with the signing inputs and checks the signed APKs.
phonemesh.maxSignedApkBytes.arm64-v8a=16901233
phonemesh.maxSignedApkBytes.armeabi-v7a=14890111
